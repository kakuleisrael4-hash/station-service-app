<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applique le thème persisté AVANT le premier paint (évite le flash).
      try {
        var t = localStorage.getItem('kkcoil.theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA : "Ajouter à l'écran d'accueil" lance l'app en plein écran, sans
         barre d'adresse du navigateur — ressemble à une vraie application. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KKC OIL" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Police Inter (référencée par tailwind.config.js mais jamais chargée
         jusqu'ici -> l'app retombait silencieusement sur la police système
         de l'OS, pas Inter). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="STATION KKC OIL — Carburant de qualité, gestion moderne et transparente de votre station-service."
    />
    <title>STATION KKC OIL — Énergie de confiance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
