<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applique le thème persisté AVANT le premier paint (évite le flash).
      try {
        var t = localStorage.getItem('kkcoil.theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Police Inter (référencée par tailwind.config.js mais jamais chargée
         jusqu'ici -> l'app retombait silencieusement sur la police système
         de l'OS, pas Inter). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="STATION KKC OIL — Carburant de qualité, gestion moderne et transparente de votre station-service."
    />
    <title>STATION KKC OIL — Énergie de confiance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
