<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applique le thème persisté AVANT le premier paint (évite le flash).
      try {
        var t = localStorage.getItem('kkcoil.theme');
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="STATION KKC OIL — Carburant de qualité, gestion moderne et transparente de votre station-service."
    />
    <title>STATION KKC OIL — Énergie de confiance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
